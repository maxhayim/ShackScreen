name: Icon request
description: Suggest or contribute a new or better icon for an application in ShackScreen. Specs are in docs/ICONS.md.
title: "Icon request: "
labels: ["icon request"]
body:
  - type: input
    id: name
    attributes:
      label: Application
      placeholder: e.g. GMRS Hub
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Web address
      placeholder: https://…
  - type: textarea
    id: icon
    attributes:
      label: Icon
      description: Attach the PNG (512 × 512, rounded corners, see docs/ICONS.md) or link to it. Colour, dark, light, or any of them. Say where the logo came from.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Anything else?
